<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>You're offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", system-ui, sans-serif; background: #fff; color: #59595B; }
  main { max-width: 380px; padding: 24px; text-align: center; }
  img { width: 130px; height: auto; }
  h1 { font-size: 22px; color: #3c3c3e; margin: 18px 0 8px; }
  p { line-height: 1.6; margin: 0 0 20px; }
  button { border: 0; border-radius: 8px; padding: 12px 22px; background: #9D1D21; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style></head>
<body><main>
  <img src="logo-mark.png" alt="Sheetal" />
  <h1>You're offline</h1>
  <p>Sheetal needs the internet. Check your connection, then try again.</p>
  <button type="button" id="again">Try again</button>
</main>
<script>
  const back = new URLSearchParams(location.search).get("back") || "https://sheetalproperty.com/?source=app";
  document.getElementById("again").onclick = () => { location.href = back; };
  window.addEventListener("online", () => { location.href = back; });
</script>
</body></html>
