# GitHub Actions: on every push and pull request, checks that the schema matches the migrations, runs `npm run check`
# (command list, manifest and import-rule checks, lint, typecheck, all tests) and `npm run build`.
# Where it fits: this is the "main always green" rule from docs/GIT-WORKFLOW.md. A red cross here = do not merge.
# Workspaces: the root package.json lists the new folders (platform, packages/*, apps/*) next to the old ones, so one
# `npm ci` installs them all and `npm run check` covers them. When a workspace is added, package-lock.json must be
# committed with it, or `npm ci` below fails (that is the point: the lock file and the workspaces must agree).
# How the tests get a database: backend-core/test/setup-db.ts starts its own throwaway PostgreSQL (embedded-postgres)
# on a free port, migrates it and deletes it at the end. It does not read DATABASE_URL. The PostgreSQL 16 service
# below is therefore a spare: it makes the runner look like the real setup and is ready if a test ever needs a
# server. The values below are fake and only for tests; never put a real key in this file.
name: check

on:
  push:
  pull_request:

# A new push to the same branch cancels the older run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sheetal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d sheetal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      NODE_ENV: test
      # Fake, test-only settings. Names checked by the Lead against backend-core/.env.example (9 Nov 2026).
      DATABASE_URL: postgresql://test:test@localhost:5432/sheetal_test
      SITE_URL: http://localhost:5173
      API_URL: http://localhost:4000
      SECRETS_KEY: ci-only-secret-key-not-used-anywhere-else-32chars

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      # backend-core/package.json asks for Node 22 or newer, so CI uses 22 (not 20).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Keep downloaded packages between runs
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # `npm ci` is exact and fast when package-lock.json is in the repo; otherwise fall back to `npm install`.
      - name: Install packages
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # Fails early, with a clear message, if a workspace folder or its link in node_modules is missing.
      - name: Confirm the workspaces are installed
        run: |
          for p in platform packages/ui packages/sdk packages/config apps/expenses apps/reviews; do
            test -f "$p/package.json" || { echo "Missing workspace folder: $p"; exit 1; }
          done
          npm ls @sheetal/platform @sheetal/ui @sheetal/sdk @sheetal/config @sheetal/app-expenses @sheetal/app-reviews --depth=0

      # The Prisma schema stays in backend-core/prisma until step 14 of docs/architecture/FOLDERS-AND-MOVE-PLAN.md.
      - name: Generate the Prisma client
        run: npx prisma generate
        working-directory: backend-core

      # The schema and the migrations must agree (QA rule since P1-DB-1). The spare PostgreSQL 16 above is the shadow
      # database. --exit-code makes a difference fail the run (exit 2) instead of only printing it.
      - name: Schema is valid and the migrations match it
        run: |
          npx prisma validate
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code
        working-directory: backend-core

      - name: Lint, typecheck and test
        run: npm run check

      # The three front-ends and the website must still build (QA asked for `npm run build` on every screen task).
      - name: Build
        run: npm run build
